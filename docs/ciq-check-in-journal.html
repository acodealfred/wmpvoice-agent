<title>The Check-in Journal</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=Archivo:wght@400;500;600;700&display=swap" />
<style>
  :root {
    /* Pre-dawn indigo — a dark room before a shift */
    --night:   #0F1420;
    --night-2: #161C2B;
    --night-3: #1D2436;
    --rule:    #262F44;
    --rule-2:  #1E263A;

    --ink:   #E8E6E1;
    --ink-2: #A7ADBD;
    --ink-3: #737B8F;
    --ink-4: #545C70;

    --indigo: #8FA5D9;   /* the agent, margin labels */
    --moss:   #93BFA0;   /* trust marker ONLY */
    --moss-d: #17301F;

    /* The one warm surface in the room: your own page */
    --page:     #F0EADC;
    --page-ink: #2A2620;
    --page-ink2:#5A5346;
    --page-rule:#DCD3C0;

    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans:  "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
  }
  :root[data-script="recipient"] { font-size: 18.5px; }

  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0; background: var(--night); color: var(--ink);
    font-family: var(--serif); font-size: 1rem; line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 4.5rem;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; border-radius: 2px; }
  p { margin: 0; }
  [hidden] { display: none !important; }

  /* ── Demo strip (scaffolding, pinned in px) ───────────────────────── */
  .demo {
    font-family: var(--sans); font-size: 16px;
    position: sticky; top: 0; z-index: 30;
    background: rgba(10, 14, 24, .93); backdrop-filter: blur(10px);
    border-bottom: 1px dashed #2E3A54;
  }
  .demo-in { width: min(60rem, calc(100% - 2rem)); margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; padding: .55rem 0 .5rem; }
  .demo-k { color: var(--ink-4); font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .demo-btns { display: flex; flex-wrap: wrap; gap: .28rem; }
  .demo-btns button {
    border: 1px solid var(--rule); border-radius: 999px; background: transparent;
    color: var(--ink-3); padding: .3rem .75rem; font-size: .75rem; font-weight: 500;
    transition: background .15s, color .15s, border-color .15s;
  }
  .demo-btns button:hover { color: var(--ink); border-color: #3A4661; }
  .demo-btns button[aria-pressed="true"] { background: var(--ink); color: var(--night); border-color: var(--ink); font-weight: 600; }
  .demo-note { flex: 1 1 100%; color: var(--ink-4); font-size: .72rem; padding-bottom: .45rem; }
  .demo-note b { color: var(--ink-3); font-weight: 600; }
  .demo-actions { margin-left: auto; display: flex; gap: .3rem; }
  .demo-actions button { border: 1px solid var(--rule); border-radius: .35rem; background: transparent; color: var(--ink-3); font-size: .72rem; padding: .28rem .6rem; }
  .demo-actions button:hover { color: var(--ink); border-color: #3A4661; }

  /* ── The column ───────────────────────────────────────────────────── */
  .column { width: min(46rem, calc(100% - 2.5rem)); margin: 0 auto; }

  .up-marker { text-align: center; padding: 2.2rem 0 .6rem; }
  .up-marker span { font-family: var(--sans); font-size: .72rem; color: var(--ink-4); letter-spacing: .08em; }

  /* Entry heads — a dated ledger, not a chat timestamp */
  .entry-head { display: flex; align-items: baseline; gap: .9rem; padding: 2.4rem 0 1.2rem; }
  .entry-head::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .entry-n {
    font-family: var(--sans); font-size: .68rem; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--indigo); white-space: nowrap;
  }
  .entry-date { font-family: var(--sans); font-size: .74rem; color: var(--ink-4); white-space: nowrap; }

  .entry.past { opacity: .58; }
  .entry.past:hover { opacity: .82; }

  /* Turns: margin gutter + measure. No bubbles, no avatars, no alternating sides. */
  .turn { display: grid; grid-template-columns: 4.2rem 1fr; gap: 1.4rem; padding: .55rem 0; }
  .turn .who {
    font-family: var(--sans); font-size: .64rem; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-4);
    padding-top: .42rem; text-align: right;
  }
  .turn.ciq .who { color: var(--indigo); }
  .turn .said { font-size: 1.06rem; max-width: 34rem; }
  .turn.you .said { color: var(--ink-2); }
  .turn.note { padding: .3rem 0; }
  .turn.note .said {
    font-family: var(--sans); font-size: .76rem; color: var(--ink-4);
    display: inline-flex; align-items: center; gap: .5rem;
  }
  .turn.note .said::before { content: ""; width: .35rem; height: .35rem; border-radius: 50%; background: var(--moss); flex: none; }
  .appear { animation: settle .5s ease both; }
  @keyframes settle { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Spoken replies — the person's side of a consent exchange */
  .replies { display: flex; flex-wrap: wrap; gap: .45rem; padding: .5rem 0 .3rem; }
  .reply {
    font-family: var(--sans); font-size: .87rem; font-weight: 500;
    border: 1px solid var(--rule); border-radius: 999px; background: transparent;
    color: var(--ink); padding: .5rem 1.05rem;
    transition: background .15s, border-color .15s;
  }
  .reply:hover { background: var(--night-3); border-color: #3A4661; }
  .reply.lead { background: var(--ink); color: var(--night); border-color: var(--ink); }
  .reply.lead:hover { background: #fff; }

  /* Inline consent detail — progressive disclosure, never a wall */
  .detail {
    border-left: 2px solid var(--rule); padding: .3rem 0 .3rem 1.1rem;
    margin: .5rem 0; display: grid; gap: .55rem;
  }
  .detail p { font-family: var(--sans); font-size: .87rem; color: var(--ink-2); }
  .detail .yes { color: var(--moss); font-weight: 600; }
  .detail .no  { color: var(--ink-3); font-weight: 600; }

  .thinking { display: inline-flex; gap: .3rem; padding-top: .6rem; }
  .thinking i { width: .3rem; height: .3rem; border-radius: 50%; background: var(--ink-4); animation: blip 1.3s ease-in-out infinite; }
  .thinking i:nth-child(2) { animation-delay: .18s; }
  .thinking i:nth-child(3) { animation-delay: .36s; }
  @keyframes blip { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* ── Today's reflection: the one warm page ────────────────────────── */
  .reflection {
    background: var(--page); color: var(--page-ink);
    border-radius: .5rem; padding: 2rem 2.1rem 1.7rem;
    margin: 1.6rem 0 .6rem;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
  }
  .reflection .r-k {
    font-family: var(--sans); font-size: .64rem; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--page-ink2);
  }
  .reflection h2 { font-size: clamp(1.5rem, 3.4vw, 2.05rem); font-weight: 500; line-height: 1.22; margin: .7rem 0 .7rem; letter-spacing: -.01em; text-wrap: balance; }
  .reflection .r-body { font-size: 1.02rem; color: #453F35; }
  .reflection .r-vs { font-size: .93rem; color: var(--page-ink2); border-top: 1px solid var(--page-rule); margin-top: 1.1rem; padding-top: .9rem; }
  .reflection .r-vs b { color: var(--page-ink); font-weight: 500; }

  .step { border-top: 1px solid var(--page-rule); margin-top: 1.2rem; padding-top: 1.2rem; }
  .step .s-k { font-family: var(--sans); font-size: .64rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--page-ink2); }
  .step h3 { font-size: 1.22rem; font-weight: 500; margin: .5rem 0 .35rem; }
  .step p { font-size: .93rem; color: #4E4739; margin-bottom: 1.1rem; }
  .step-btn {
    font-family: var(--sans); font-weight: 600; font-size: .93rem;
    background: var(--page-ink); color: var(--page); border: 0;
    border-radius: .4rem; padding: .85rem 1.5rem;
  }
  .step-btn:hover { background: #000; }
  .step-alt { display: grid; gap: .3rem; margin-top: 1rem; }
  .step-alt button {
    font-family: var(--sans); font-size: .87rem; text-align: left;
    background: transparent; border: 0; border-top: 1px solid var(--page-rule);
    padding: .7rem 0 .1rem; color: var(--page-ink);
  }
  .step-alt button small { display: block; color: var(--page-ink2); font-size: .78rem; }
  .step-alt button:hover { color: #000; }

  /* What I noticed — inline, quiet, no instrumentation styling */
  .noticed { margin-top: 1.2rem; border-top: 1px solid var(--page-rule); }
  .noticed summary {
    list-style: none; cursor: pointer; font-family: var(--sans); font-size: .82rem;
    color: var(--page-ink2); padding: .9rem 0 .2rem; display: flex; align-items: center; gap: .45rem;
  }
  .noticed summary::-webkit-details-marker { display: none; }
  .noticed summary::before { content: "▸"; transition: transform .18s; }
  .noticed[open] summary::before { transform: rotate(90deg); }
  .noticed summary:hover { color: var(--page-ink); }
  .noticed-body { padding-bottom: 1rem; }
  .n-list { font-family: var(--sans); font-size: .88rem; display: grid; gap: 0; margin: .5rem 0 0; }
  .n-list div { display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--page-rule); padding: .5rem 0; }
  .n-list div:first-child { border-top: 0; }
  .n-list .lbl { color: #4E4739; }
  .n-list .val { color: var(--page-ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .n-why { font-family: var(--sans); font-size: .8rem; color: var(--page-ink2); margin-top: .9rem; line-height: 1.55; }

  .keep { font-family: var(--sans); font-size: .78rem; color: var(--ink-4); padding: .8rem 0 0; }

  /* Past entries, condensed — the journal keeps them, folded */
  .past-line { font-size: 1.02rem; color: var(--ink-2); max-width: 34rem; }
  .past-open { margin-top: .7rem; }
  .past-open summary {
    list-style: none; cursor: pointer; font-family: var(--sans); font-size: .78rem;
    color: var(--ink-4); display: inline-flex; align-items: center; gap: .4rem;
  }
  .past-open summary::-webkit-details-marker { display: none; }
  .past-open summary::before { content: "▸"; transition: transform .18s; }
  .past-open[open] summary::before { transform: rotate(90deg); }
  .past-open summary:hover { color: var(--ink-2); }
  .past-open .turns { padding-top: .6rem; }

  /* ── Persistent trust marker — always visible, never a modal ──────── */
  .trust {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    font-family: var(--sans);
    background: rgba(10, 14, 24, .94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--rule);
  }
  .trust-in {
    width: min(46rem, calc(100% - 2.5rem)); margin: 0 auto;
    display: flex; align-items: center; gap: .7rem; padding: .75rem 0;
    font-size: .78rem; color: var(--ink-3);
  }
  .lamp { width: .45rem; height: .45rem; border-radius: 50%; background: var(--ink-4); flex: none; transition: background .3s; }
  .trust.on .lamp { background: var(--moss); box-shadow: 0 0 0 3px rgba(147, 191, 160, .16); }
  .trust.on #trust-text { color: var(--moss); }
  .trust-sep { color: var(--ink-4); }
  .trust-detail { margin-left: auto; border: 0; background: transparent; color: var(--ink-3); font-size: .78rem; text-decoration: underline; text-underline-offset: 3px; }
  .trust-detail:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .turn { grid-template-columns: 1fr; gap: .1rem; }
    .turn .who { text-align: left; padding-top: 0; }
    .reflection { padding: 1.5rem 1.4rem 1.3rem; }
    .trust-in { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

<div class="demo">
  <div class="demo-in">
    <span class="demo-k">Demo · script</span>
    <div class="demo-btns" role="group" aria-label="Deployment script">
      <button type="button" data-script="rig" aria-pressed="true">Petroleum</button>
      <button type="button" data-script="care" aria-pressed="false">Eldercare · caregiver</button>
      <button type="button" data-script="recipient" aria-pressed="false">Eldercare · resident</button>
    </div>
    <div class="demo-actions">
      <button type="button" id="skip">Skip to reflection</button>
      <button type="button" id="replay">Replay</button>
    </div>
    <p class="demo-note" id="demo-note"></p>
  </div>
</div>

<main class="column" id="column">
  <p class="up-marker"><span id="up-text">↑ your earlier check-ins</span></p>
  <div id="past"></div>
  <div id="today"></div>
</main>

<div class="trust" id="trust">
  <div class="trust-in">
    <span class="lamp" aria-hidden="true"></span>
    <span id="trust-text">Camera and microphone are off</span>
    <span class="trust-sep" aria-hidden="true">·</span>
    <span>Only you can read this page</span>
    <button class="trust-detail" type="button" id="trust-more">What's kept</button>
  </div>
</div>

      entryN: "Your sixth check-in", entryDate: "Today · 21:10, after the night round",
      turns: [

      },
      past: [
        { n: "Yesterday", d: "Monday afternoon", line: "Much like your usual days. You'd been out in the garden and said you'd slept well.", turns: [["ciq", "How did you sleep last night?"], ["you", "Right through, for once."], ["ciq", "How rested do you feel?"], ["you", "Fairly rested, thank you."]] },
        { n: "Sunday", d: "Sunday morning", line: "Much like your usual days. Your son had visited the day before.", turns: [["ciq", "How was your weekend?"], ["you", "Lovely. David came."]] }
      ]
    }
  };

  const CONSENT_DETAIL = [
    ["yes", "Kept for you", "Your answers, today's page, and a few derived numbers."],
    ["no", "Never kept", "Video and audio. They're read in the moment, then gone."],
    ["no", "Never shared", "Your individual page. Your employer sees combined trends only."],
    ["yes", "Always yours", "Stop whenever you like. This is a reflection, not a test, and never a clearance decision."]
  ];

  let key = "rig", timers = [], done = false;
  const S = () => SCRIPTS[key];

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function turnEl(who, text, cls) {
    const d = document.createElement("div");
    d.className = `turn ${who} appear${cls ? " " + cls : ""}`;
    const label = who === "ciq" ? "CIQ" : who === "you" ? "You" : "";
    d.innerHTML = `<span class="who">${label}</span><p class="said"></p>`;
    d.querySelector(".said").textContent = text;
    return d;
  }

  function setTrust(on, text) {
    const t = $("#trust");
    t.classList.toggle("on", on);
    $("#trust-text").textContent = text;
  }

  function renderPast() {
    $("#past").innerHTML = S().past.map(p => `
      <article class="entry past">
        <header class="entry-head"><span class="entry-n">${p.n}</span><span class="entry-date">${p.d}</span></header>
        <p class="past-line">${p.line}</p>
        <details class="past-open">
          <summary>the whole conversation</summary>
          <div class="turns">
            ${p.turns.map(t => `<div class="turn ${t[0]}"><span class="who">${t[0] === "ciq" ? "CIQ" : "You"}</span><p class="said">${t[1]}</p></div>`).join("")}
          </div>
        </details>
      </article>`).reverse().join("");
  }

  function buildReflection() {
    const r = S().reflection;
    const el = document.createElement("div");
    el.className = "appear";
    el.innerHTML = `
      <div class="reflection">
        <span class="r-k">Today's page</span>
        <h2>${r.h}</h2>
        <p class="r-body">${r.body}</p>
        <p class="r-vs">${r.vs}</p>

        <div class="step">
          <span class="s-k">${r.step.k}</span>
          <h3>${r.step.h}</h3>
          <p>${r.step.p}</p>
          <button class="step-btn" type="button">${r.step.cta}</button>
          <div class="step-alt">
            ${r.alts.map(a => `<button type="button">${a[0]}<small>${a[1]}</small></button>`).join("")}
          </div>
        </div>

        <details class="noticed">
          <summary>what I noticed while we talked</summary>
          <div class="noticed-body">
            <div class="n-list">
              ${r.noticed.map(n => `<div><span class="lbl">${n[0]}</span><span class="val">${n[1]}</span></div>`).join("")}
            </div>
            <p class="n-why">Shown as change against your own baseline, read during the first minute of our conversation — not as raw readings, because a blink rate on its own means nothing without knowing yours. A page moves with sleep, workload, heat and much else. It describes today. It doesn't describe you, and it isn't a medical result.</p>
          </div>
        </details>
      </div>
      <p class="keep">This page is yours. It stays here, and nobody else can open it.</p>`;
    return el;
  }

  function play() {
    clearTimers(); done = false;
    const s = S();
    const today = $("#today");
    today.innerHTML = `<header class="entry-head"><span class="entry-n">${s.entryN}</span><span class="entry-date">${s.entryDate}</span></header>`;
    $("#up-text").textContent = s.up;
    setTrust(false, "Camera and microphone are off");
    renderPast();

    let at = 300;
    s.turns.forEach((turn) => {
      /* Offered replies surface just after the question, then give way to what
         was actually said — you tap or you speak, and the page keeps the answer. */
      if (turn.replies) {
        timers.push(setTimeout(() => {
          const wrap = document.createElement("div");
          wrap.className = "replies appear js-replies";
          wrap.style.marginLeft = "5.6rem";
          wrap.innerHTML = turn.replies.map(r => `<button class="reply" type="button">${r}</button>`).join("");
          today.appendChild(wrap);
          window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        }, at + 450));
      }
      at += turn.ms;
      timers.push(setTimeout(() => {
        if (turn.lamp) setTrust(true, "Camera on · nothing is being recorded");
        today.querySelectorAll(".js-replies").forEach(n => n.remove());
        today.appendChild(turnEl(turn.who, turn.t, turn.who === "note" ? "note" : ""));

        if (turn.consent) {
          const d = document.createElement("details");
          d.className = "past-open appear";
          d.style.margin = ".2rem 0 .2rem 5.6rem";
          d.innerHTML = `<summary>tell me exactly what's kept</summary>
            <div class="detail">
              ${CONSENT_DETAIL.map(c => `<p><span class="${c[0]}">${c[1]}:</span> ${c[2]}</p>`).join("")}
            </div>`;
          today.appendChild(d);
        }
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      }, at));
    });

    at += 1500;
    timers.push(setTimeout(() => {
      const think = document.createElement("div");
      think.className = "turn ciq appear";
      think.innerHTML = `<span class="who">CIQ</span><span class="thinking"><i></i><i></i><i></i></span>`;
      today.appendChild(think);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      timers.push(setTimeout(() => {
        think.remove();
        finish();
      }, 2200));
    }, at));
  }

  function finish() {
    if (done) return;
    done = true;
    $("#today").appendChild(buildReflection());
    setTrust(false, "Camera and microphone are off again");
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function skip() {
    clearTimers();
    const s = S(), today = $("#today");
    today.innerHTML = `<header class="entry-head"><span class="entry-n">${s.entryN}</span><span class="entry-date">${s.entryDate}</span></header>`;
    s.turns.forEach(t => today.appendChild(turnEl(t.who, t.t, t.who === "note" ? "note" : "")));
    done = false;
    finish();
  }

  function setScript(k) {
    key = k;
    document.documentElement.setAttribute("data-script", k);
    document.querySelectorAll(".demo-btns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.script === k)));
    $("#demo-note").innerHTML = S().note;
    play();
  }

  document.addEventListener("click", e => {
    const b = e.target.closest(".demo-btns button");
    if (b) return setScript(b.dataset.script);
    const rep = e.target.closest(".reply");
    if (rep) { rep.parentElement.querySelectorAll(".reply").forEach(x => x.classList.remove("lead")); rep.classList.add("lead"); }
  });
  $("#skip").addEventListener("click", skip);
  $("#replay").addEventListener("click", () => { window.scrollTo({ top: 0 }); play(); });
  $("#trust-more").addEventListener("click", () => {
    const d = document.querySelector("#today details");
    if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" }); }
  });

  setScript("rig");
</script>
